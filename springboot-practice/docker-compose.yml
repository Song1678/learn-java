# 可选：不想在本机安装 MySQL 时，装了 Docker 的话执行 `docker compose up -d` 即可启动一个 MySQL 8。
# 账号 root / 123456，端口 3306，和 db.properties 默认值一致。
# 没有 Docker 就忽略这个文件，按 docs/00-安装MySQL与客户端.md 在本机安装即可。
services:
  mysql:
    image: mysql:8.0
    container_name: learn-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - learn-mysql-data:/var/lib/mysql

volumes:
  learn-mysql-data:
