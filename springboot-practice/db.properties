# =============================================================
# MySQL 连接配置：改成你自己电脑上 MySQL 的账号密码（和 mysql-practice 的 db.properties 一样）
# 也可以用环境变量覆盖：DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD
# =============================================================
db.host=localhost
db.port=3306
db.username=root
db.password=123456

# 启动项目时用的库（每次启动都会被重置成示例数据）。
# 跑测试用的是另一个库 learn_web_test（见 src/test/resources/application-test.yml），每个测试前都会重置。
# 这两个库都不要放你自己的重要数据！
db.database=learn_web
