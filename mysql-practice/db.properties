# =============================================================
# MySQL 连接配置：改成你自己电脑上 MySQL 的账号密码
# 也可以用环境变量覆盖：DB_HOST / DB_PORT / DB_USER / DB_PASSWORD
# =============================================================
db.host=localhost
db.port=3306
db.username=root
db.password=123456

# 练习用的数据库名。测试每次运行都会【删掉并重建】这个库，
# 所以千万不要改成你存放重要数据的库！
db.database=learn_sql_test
